name = "nabil-api"
main = "worker/index.js"
compatibility_date = "2024-10-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/images/*"]

# D1 — relational database (products, categories, users, sessions, settings)
[[d1_databases]]
binding = "DB"
database_name = "web-store"
database_id = "ed4b1eba-4af2-4347-8d08-969cff4fbeb5"

# R2 — cloud storage for product/category images
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "nabil-images"

# Sessions are signed with this secret. NEVER commit the real value.
# Generate one: openssl rand -hex 32  →  put it in .dev.vars locally,
# and: npx wrangler secret put SESSION_SECRET  (for production)
# [vars]
# SESSION_SECRET = "dev-only-insecure-secret"
